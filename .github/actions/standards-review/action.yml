name: 'Standards Review'
description: 'Run standards compliance linter, check the PR title, and post results as PR comment'
inputs:
  standards-path:
    description: 'Path to .standards/ submodule (default: .standards)'
    required: false
    default: '.standards'
  pr-title-check:
    description: >-
      Conventional Commits check on the PR title. Squash-merge uses the PR title as
      the mainline commit subject, so branch commits alone do not protect history.
      One of: fail (default — blocks the check), warn (annotates only), off.
      Any other value is reported and treated as fail, so a typo cannot
      silently disable the check.
    required: false
    default: 'fail'
  changed-only:
    description: >-
      On pull_request events, scan only files changed against the PR base
      branch (lint-standards.sh --since origin/<base>). Requires
      actions/checkout with fetch-depth: 0. Config/history checks still run on
      the whole project.
    required: false
    default: 'false'
  timeout:
    description: 'Per-check wall-clock guard in seconds (0 disables). Default: linter default (60).'
    required: false
    default: ''
  fail-on-timeout:
    description: >-
      Report any check that hits the timeout as FAIL instead of WARN, so an
      incomplete scan can never pass the gate. Security checks (no-secrets,
      banned-functions) FAIL on timeout regardless of this input.
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Check PR title (Conventional Commits)
      id: title
      # pull_request_target (the fork-friendly trigger in the workflow template)
      # carries the same github.event.pull_request payload, so the title is
      # available there too.
      if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && inputs.pr-title-check != 'off'
      shell: bash
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        TITLE_MODE: ${{ inputs.pr-title-check }}
        STANDARDS_PATH: ${{ inputs.standards-path }}
      run: |
        case "$TITLE_MODE" in
          fail|warn) ;;
          *)
            echo "::warning::pr-title-check='$TITLE_MODE' is not one of fail|warn|off; treating it as fail"
            TITLE_MODE=fail
            ;;
        esac

        CHECKER="$STANDARDS_PATH/scripts/check-commit-message.sh"
        if [ ! -f "$CHECKER" ]; then
          CHECKER="scripts/check-commit-message.sh"
        fi
        if [ ! -f "$CHECKER" ]; then
          CHECKER="${{ github.action_path }}/../../../scripts/check-commit-message.sh"
        fi
        if [ ! -f "$CHECKER" ]; then
          echo "::warning::check-commit-message.sh not found; skipping PR title check"
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        chmod +x "$CHECKER"

        # --no-exempt: fixup!/Merge/Revert "..." exemptions are for branch commits
        # that git rewrites; a PR title lands verbatim on squash-merge.
        if DETAIL=$("$CHECKER" --no-exempt "$PR_TITLE" 2>&1); then
          echo "status=pass" >> "$GITHUB_OUTPUT"
          echo "PR title follows Conventional Commits: $PR_TITLE"
          exit 0
        fi

        echo "status=fail" >> "$GITHUB_OUTPUT"
        {
          echo "detail<<DETAIL_EOF"
          echo "$DETAIL"
          echo "DETAIL_EOF"
        } >> "$GITHUB_OUTPUT"
        echo "$DETAIL"
        echo ""
        echo "Why this matters: with squash-merge, GitHub writes the PR title (not your"
        echo "branch commits) as the commit subject on the default branch. A prose title"
        echo "becomes a permanent non-Conventional commit in mainline history."
        echo "Fix: edit the PR title to <type>(<scope>): <subject>, e.g. feat(api): add endpoint"
        if [ "$TITLE_MODE" = "warn" ]; then
          echo "::warning::PR title is not a Conventional Commit (pr-title-check: warn): $PR_TITLE"
        else
          echo "::error::PR title is not a Conventional Commit: $PR_TITLE"
        fi

    - name: Run standards linter
      id: lint
      shell: bash
      env:
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        CHANGED_ONLY: ${{ inputs.changed-only }}
        CHECK_TIMEOUT: ${{ inputs.timeout }}
        FAIL_ON_TIMEOUT: ${{ inputs.fail-on-timeout }}
      run: |
        LINTER="${{ inputs.standards-path }}/scripts/lint-standards.sh"
        if [ ! -f "$LINTER" ]; then
          LINTER="scripts/lint-standards.sh"
        fi
        if [ -f "$LINTER" ]; then
          chmod +x "$LINTER"
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request_target" ]; then
            echo "::warning::pull_request_target checks out the base branch by default, so these content checks are inspecting the base, not the PR head. Keep this job metadata-only (PR title) and lint PR content from a pull_request job; see templates/standards-review.yml.example."
          fi
          # On a PR, default the conventional-commits range to the PR base so the
          # PR is judged on its own commits (.standards.yml commits.* still wins).
          # Exported even when the ref is missing (shallow checkout) so the module
          # reports the missing ref instead of silently falling back to a window.
          if [ -n "$PR_BASE_REF" ]; then
            export STANDARDS_COMMITS_SINCE="origin/$PR_BASE_REF"
            if ! git rev-parse --verify --quiet "origin/$PR_BASE_REF^{commit}" >/dev/null 2>&1; then
              echo "::warning::origin/$PR_BASE_REF is not in this checkout; use actions/checkout with fetch-depth: 0 so the conventional-commits check can inspect the PR's commits."
            fi
          fi
          LINT_ARGS=()
          if [ "$CHANGED_ONLY" = "true" ] && [ -n "$PR_BASE_REF" ]; then
            # No --depth: the checkout is already complete (fetch-depth: 0) and
            # a shallow fetch would turn the base tip into a history boundary,
            # breaking the merge-base that --since relies on.
            git fetch --no-tags origin "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}" 2>/dev/null || true
            LINT_ARGS+=(--since "origin/${PR_BASE_REF}")
          fi
          if [ -n "$CHECK_TIMEOUT" ]; then
            LINT_ARGS+=(--timeout "$CHECK_TIMEOUT")
          fi
          if [ "$FAIL_ON_TIMEOUT" = "true" ]; then
            LINT_ARGS+=(--fail-on-timeout)
          fi
          LINT_ERR=$(mktemp)
          set +e
          RESULTS=$("$LINTER" --format json "${LINT_ARGS[@]+"${LINT_ARGS[@]}"}" 2>"$LINT_ERR")
          LINT_RC=$?
          set -e
          case "$RESULTS" in
            \{*) ;;
            *)
              # The linter exits 1 with JSON when checks FAIL; no JSON at all
              # means it aborted (bad --timeout value, unknown option, crash).
              # That must not be reported as a clean run.
              echo "::error::lint-standards.sh produced no results (exit $LINT_RC): $(tr '\n' ' ' < "$LINT_ERR")"
              RESULTS='{"summary":{"pass":0,"warn":0,"fail":1,"total":1},"results":[{"status":"FAIL","check":"lint-standards","message":"linter aborted before producing results (exit '"$LINT_RC"')"}]}'
              ;;
          esac
          rm -f "$LINT_ERR"
          echo "results<<RESULTS_EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULTS" >> "$GITHUB_OUTPUT"
          echo "RESULTS_EOF" >> "$GITHUB_OUTPUT"

          # Count results from JSON summary block
          PASS=$(echo "$RESULTS" | grep -o '"pass":[[:space:]]*[0-9]*' | head -1 | grep -o '[0-9]*$' || echo 0)
          WARN=$(echo "$RESULTS" | grep -o '"warn":[[:space:]]*[0-9]*' | head -1 | grep -o '[0-9]*$' || echo 0)
          FAIL=$(echo "$RESULTS" | grep -o '"fail":[[:space:]]*[0-9]*' | head -1 | grep -o '[0-9]*$' || echo 0)
          PASS="${PASS:-0}"
          WARN="${WARN:-0}"
          FAIL="${FAIL:-0}"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "warn=$WARN" >> "$GITHUB_OUTPUT"
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          if [ "$FAIL" -gt 0 ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "::error::Linter script not found. Check standards-path and submodule checkout."
          echo "results={}" >> "$GITHUB_OUTPUT"
          echo "pass=0" >> "$GITHUB_OUTPUT"
          echo "warn=0" >> "$GITHUB_OUTPUT"
          echo "fail=1" >> "$GITHUB_OUTPUT"
          echo "has_failures=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Post PR comment
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LINT_RESULTS: ${{ steps.lint.outputs.results }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        TITLE_STATUS: ${{ steps.title.outputs.status }}
        TITLE_MODE: ${{ inputs.pr-title-check }}
      run: |
        PASS="${{ steps.lint.outputs.pass }}"
        WARN="${{ steps.lint.outputs.warn }}"
        FAIL="${{ steps.lint.outputs.fail }}"
        TOTAL=$((PASS + WARN + FAIL))

        if [ "$TOTAL" -eq 0 ] && [ "$TITLE_STATUS" != "fail" ]; then
          echo "No lint results to post"
          exit 0
        fi

        # Build comment body in a temp file to avoid shell quoting issues
        COMMENT_FILE=$(mktemp)

        {
          printf "## Standards Review\n\n"
          if [ "$FAIL" -gt 0 ]; then
            printf ":x: **%s failure(s)** found\n\n" "$FAIL"
          elif [ "$WARN" -gt 0 ]; then
            printf ":warning: **%s warning(s)** found\n\n" "$WARN"
          else
            printf ":white_check_mark: All checks passed\n\n"
          fi

          case "$TITLE_STATUS" in
            fail)
              if [ "$TITLE_MODE" = "warn" ]; then
                printf ":warning: **PR title** is not a Conventional Commit: \`%s\`\n\n" "$PR_TITLE"
              else
                printf ":x: **PR title** is not a Conventional Commit: \`%s\`\n\n" "$PR_TITLE"
              fi
              printf "Squash-merge writes the PR title as the mainline commit subject, so it must be "
              printf "\`<type>(<scope>): <subject>\` (e.g. \`feat(api): add endpoint\`) even when every branch commit already is.\n\n"
              ;;
            pass)
              printf ":white_check_mark: PR title follows Conventional Commits\n\n"
              ;;
          esac

          printf "| Status | Check | Details |\n"
          printf "|--------|-------|--------|\n"

          # Parse JSON results array using python3 (available on all GitHub-hosted runners)
          if command -v python3 >/dev/null 2>&1; then
            python3 "${{ github.action_path }}/format-results.py" "$LINT_RESULTS"
          fi

          printf "\n---\n"
          printf "*Generated by [Coding Standards](https://coding-standards.c65llc.com) linter*\n"
        } > "$COMMENT_FILE"

        gh pr comment "${{ github.event.pull_request.number }}" --edit-last --body-file "$COMMENT_FILE" 2>/dev/null || \
        gh pr comment "${{ github.event.pull_request.number }}" --body-file "$COMMENT_FILE"
        rm -f "$COMMENT_FILE"

    - name: Set check status
      # Every mode except an explicit `warn` blocks on a failed title (`off`
      # never produces status=fail), so a misspelled mode cannot disable it.
      if: steps.lint.outputs.has_failures == 'true' || (steps.title.outputs.status == 'fail' && inputs.pr-title-check != 'warn')
      shell: bash
      env:
        TITLE_STATUS: ${{ steps.title.outputs.status }}
        TITLE_MODE: ${{ inputs.pr-title-check }}
      run: |
        if [ "${{ steps.lint.outputs.has_failures }}" = "true" ]; then
          echo "::error::Standards compliance check failed with ${{ steps.lint.outputs.fail }} failure(s)"
        fi
        if [ "$TITLE_STATUS" = "fail" ] && [ "$TITLE_MODE" != "warn" ]; then
          echo "::error::PR title must be a Conventional Commit (squash-merge uses it as the commit subject). Set pr-title-check: warn to downgrade."
        fi
        exit 1
