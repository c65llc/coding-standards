name: Dependabot auto-merge

# Enable auto-merge for Dependabot patch/minor bumps so they merge once CI
# passes. (No approval is submitted — auto-merge relies on the branch ruleset's
# required checks.) Major bumps are intentionally left for manual review.
#
# Requires the repo setting "Allow auto-merge" to be enabled and a branch
# protection rule with required status checks — otherwise `gh pr merge --auto`
# has nothing to gate on.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Gate on the PR author, not github.actor, so a maintainer re-running the
    # workflow still passes the guard for a genuine Dependabot PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch/minor
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
