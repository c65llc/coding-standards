# tinyproxy.conf — egress-proxy sidecar configuration (arch-09 §4).
#
# Bind-mounted read-only into the `egress` service by docker-compose.dev.yml.
# The allow-list it enforces is proxy/allowlist.generated.txt, mounted at
# /etc/tinyproxy/filter and GENERATED by scripts/setup-proxy.sh. Never edit the
# generated file: edit the whitelists, re-run the script, then
#   docker compose -f docker-compose.dev.yml restart egress
#
# tinyproxy's parser wants one directive per line with no trailing comments.

Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 100

# "Connect" logs one line per request (host + verdict) and every refused
# destination, without the per-header noise of "Info". Logs go to stdout, so
# `docker compose logs egress` shows exactly what was allowed and denied.
LogLevel Connect

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
ViaProxyName "egress"
DisableViaHeader Yes

# Client access: no Allow/Deny lines means every client that can reach this port
# is served. That is safe ONLY because the compose file publishes no port for
# this service, so the only possible clients are containers on devnet. Never add
# `ports:` to the egress service.

# --- Enforcement: deny by default ---------------------------------------------
# Whole-host glob matching against the destination host (not the URL), case-
# insensitive. `api.github.com` matches exactly that host and nothing else;
# `*.githubusercontent.com` matches every subdomain. Anything unmatched is
# refused with HTTP 403 before any upstream connection is made.
Filter "/etc/tinyproxy/filter"
FilterType fnmatch
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes

# CONNECT tunnels (HTTPS, and SSH for git push via GIT_SSH_COMMAND in the compose
# file) are limited to these ports. The host filter above still applies to every
# CONNECT target, so an allowed host on a listed port is the only way through.
ConnectPort 443
ConnectPort 22
