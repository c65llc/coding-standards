name: Publish site

# Cloudflare Pages is connected to this repo via the GitHub integration (no API
# tokens stored here). Its **production branch is `live`**, and Cloudflare builds
# + deploys whenever `live` changes.
#
# This workflow is the only thing that moves `live`: it fast-forwards `live` to
# the published commit ONLY when we cut a release or add/edit a blog post — so
# the site republishes on exactly those events, not on every merge to `main`.
# It uses the built-in GITHUB_TOKEN (contents: write) — no secrets to manage.

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'website/src/content/docs/blog/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-live
  cancel-in-progress: false

jobs:
  advance-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit to publish
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # On a release, publish the tagged commit; otherwise the triggering
          # commit on main.
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Fast-forward `live` (triggers the Cloudflare Pages build)
        # Use --force-with-lease so an out-of-band commit pushed to `live`
        # between our read and our push is not silently clobbered. The checkout
        # above only fetched the publish ref, so capture `live`'s current SHA
        # explicitly and lease against it (creating `live` if it doesn't exist).
        run: |
          set -euo pipefail
          LIVE_SHA="$(git ls-remote origin refs/heads/live | cut -f1)"
          if [ -n "$LIVE_SHA" ]; then
            echo "Leasing live against $LIVE_SHA"
            git push --force-with-lease=live:"$LIVE_SHA" origin HEAD:live
          else
            echo "live does not exist yet — creating it"
            git push origin HEAD:live
          fi
