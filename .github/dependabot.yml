version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      # Batch website npm minor/patch bumps into a single PR so they don't
      # accumulate. Major bumps stay as their own PRs for deliberate review.
      website-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      # One PR for all GitHub Actions bumps (majors for actions are low-risk
      # and few, so group them too).
      github-actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
          - "major"
