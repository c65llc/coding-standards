# tinyproxy.conf — egress-proxy sidecar configuration (arch-09 §4).
#
# BAKED INTO the egress image by Dockerfile.egress (not bind-mounted), and the
# entrypoint asserts the enforcement directives below before tinyproxy starts,
# so neither a stale mount nor an edited copy can turn the sidecar into an open
# proxy. The allow-list it enforces is proxy/allowlist.generated.txt, mounted
# read-only at /etc/tinyproxy/filter and GENERATED by scripts/setup-proxy.sh.
# Never edit the generated file: edit the whitelists, re-run the script, then
#   docker compose -f docker-compose.dev.yml restart egress
# After editing THIS file: docker compose -f docker-compose.dev.yml up -d --build egress
#
# tinyproxy's parser wants one directive per line with no trailing comments.

Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 100

# "Connect" logs one line per request (host + verdict) and every refused
# destination, without the per-header noise of "Info". Logs go to stdout, so
# `docker compose logs egress` shows exactly what was allowed and denied.
LogLevel Connect

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
ViaProxyName "egress"
DisableViaHeader Yes

# Client access: no Allow/Deny lines means every client that can reach this port
# is served. That is safe ONLY because the compose file publishes no port for
# this service, so the only possible clients are containers on devnet. Never add
# `ports:` to the egress service.

# --- Enforcement: deny by default ---------------------------------------------
# Whole-host glob matching against the destination host (not the URL).
# `api.github.com` matches exactly that host and nothing else;
# `*.githubusercontent.com` matches every subdomain. Anything unmatched is
# refused with HTTP 403 before any upstream connection is made.
#
# fnmatch matching is case-sensitive regardless of FilterCaseSensitive (that
# directive only affects the bre/ere filter types), so the allow-list is
# normalised to lowercase by setup-proxy.sh and the entrypoint refuses any entry
# that is not. A client that spells an allowed host in upper case is denied —
# fail closed, never open.
#
# The entrypoint requires these four directives verbatim and exactly one Filter
# line; do not rename, reorder into comments, or add Upstream/Reverse* here.
Filter "/etc/tinyproxy/filter"
FilterType fnmatch
FilterURLs Off
FilterDefaultDeny Yes

# CONNECT tunnels (HTTPS, and SSH for git push via GIT_SSH_COMMAND in the compose
# file) are limited to these ports. The host filter above still applies to every
# CONNECT target, so an allowed host on a listed port is the only way through.
ConnectPort 443
ConnectPort 22
